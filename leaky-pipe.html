<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Top-down RPG</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
  <script src="rpg-world.js"></script>
  <script src="rpg-player.js"></script>
  <script src="top-down-rpg.js"></script>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: radial-gradient(ellipse 120% 80% at 50% 20%, #1e1a2e 0%, #0f0c18 45%, #08060e 100%);
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      box-sizing: border-box;
    }
    canvas {
      display: block;
      border-radius: 6px;
      box-shadow:
        0 4px 6px rgba(0, 0, 0, 0.25),
        0 24px 48px rgba(0, 0, 0, 0.45),
        0 0 0 1px rgba(255, 255, 255, 0.06);
    }
  </style>
</head>
<body>
</body>
</html>
